name: SkillSwap Arena CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ft/production
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend Validation & Test Suite
  # ==========================================
  backend-validation:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: skillswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Validate Python Syntax & Compilation
        working-directory: backend
        run: |
          python -m compileall app/

      - name: Run Alembic Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/skillswap_test
          SECRET_KEY: test_secret_key_for_ci_cd_validation_environment_32chars
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ci_test_gemini_api_key_placeholder
        run: |
          alembic upgrade head

      - name: Execute Pytest Suite (All Phases 1–8)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/skillswap_test
          SECRET_KEY: test_secret_key_for_ci_cd_validation_environment_32chars
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ci_test_gemini_api_key_placeholder
          ENVIRONMENT: test
        run: |
          pytest -v --tb=short

  # ==========================================
  # 2. Frontend Validation & Build
  # ==========================================
  frontend-validation:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Production Client Bundle
        working-directory: frontend
        run: |
          npm run build

  # ==========================================
  # 3. Security & Dependency Scans
  # ==========================================
  security-scans:
    name: Security & Secret Leak Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Private Keys or Tokens
        run: |
          echo "Scanning repository for high-risk exposed private credentials..."
          ! grep -rE --exclude-dir={.git,node_modules,venv,.venv} "(AIzaSy[0-9A-Za-z-_]{33}|ghp_[0-9A-Za-z]{36}|BEGIN PRIVATE KEY)" .

  # ==========================================
  # 4. Multi-Stage Docker Builds
  # ==========================================
  docker-build:
    name: Multi-Stage Docker Image Verification
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation, security-scans]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: skillswap-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: skillswap-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
