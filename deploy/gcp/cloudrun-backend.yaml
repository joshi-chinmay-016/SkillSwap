apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: skillswap-backend
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: skillswap-backend
    app.kubernetes.io/part-of: skillswap-arena
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/us-central1/connectors/skillswap-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/cloudsql-instances: PROJECT_ID:us-central1:skillswap-db
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: skillswap-backend-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/skillswap-repo/skillswap-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillswap-database-url
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skillswap-secret-key
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: skillswap-redis-url
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: skillswap-gemini-key
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillswap-google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillswap-google-client-secret
                  key: latest
            - name: FRONTEND_URL
              value: "https://skillswap.app"
            - name: FRONTEND_AUTH_CALLBACK_URL
              value: "https://skillswap.app/auth/callback"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
