<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Authentication &amp; OAuth Flow</text>
  <text x="475" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Email/Password Registration, bcrypt Hashing, Google/GitHub OAuth2, and JWT Lifecycle</text>

  <!-- Participants -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#6366f1"/>
    <text x="70" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">User / Browser</text>
    <line x1="70" y1="36" x2="70" y2="430" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="70" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">React Frontend</text>
    <line x1="70" y1="36" x2="70" y2="430" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#818cf8"/>
    <text x="70" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">FastAPI Backend</text>
    <line x1="70" y1="36" x2="70" y2="430" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(710, 80)">
    <rect x="0" y="0" width="150" height="36" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="75" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">PostgreSQL / OAuth</text>
    <line x1="75" y1="36" x2="75" y2="430" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <!-- Step 1: Credentials Input -->
  <line x1="150" y1="140" x2="360" y2="140" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="132" text-anchor="middle" fill="#cbd5e1" font-size="11">1. Enter Credentials / Click OAuth</text>

  <!-- Step 2: Request Dispatched -->
  <line x1="360" y1="175" x2="570" y2="175" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="167" text-anchor="middle" fill="#cbd5e1" font-size="11">2. POST /auth/login or /auth/oauth</text>

  <!-- Step 3: Password / OAuth Verification -->
  <line x1="570" y1="210" x2="785" y2="210" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="677" y="202" text-anchor="middle" fill="#cbd5e1" font-size="11">3. Query User / Exchange OAuth Code</text>

  <!-- Step 4: Verification Result -->
  <line x1="785" y1="250" x2="570" y2="250" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="677" y="242" text-anchor="middle" fill="#cbd5e1" font-size="11">4. Validate bcrypt Hash / Provider Profile</text>

  <!-- Step 5: JWT Generation -->
  <rect x="520" y="275" width="190" height="34" rx="6" fill="#1e1e38" stroke="#818cf8"/>
  <text x="615" y="296" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Generate JWT (sub, role, exp)</text>

  <!-- Step 6: Response to Client -->
  <line x1="570" y1="330" x2="360" y2="330" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="465" y="322" text-anchor="middle" fill="#cbd5e1" font-size="11">5. 200 OK (access_token, user_payload)</text>

  <!-- Step 7: Local Storage & Header Config -->
  <line x1="360" y1="370" x2="150" y2="370" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="255" y="362" text-anchor="middle" fill="#cbd5e1" font-size="11">6. Store in Zustand Store &amp; Navigate</text>

  <!-- Security Note -->
  <rect x="150" y="440" width="635" height="40" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
  <text x="467" y="465" text-anchor="middle" fill="#93c5fd" font-size="11">Security Features: bcrypt (12 rounds) • Account Suspension Guards • Zero-Privilege Escalation • OAuth State Nonce</text>
</svg>
