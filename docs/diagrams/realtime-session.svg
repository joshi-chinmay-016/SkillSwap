<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Real-Time Session &amp; Presence Architecture</text>
  <text x="475" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Multi-Worker WebSocket Coordination via Redis Pub/Sub and Embedded Jitsi Meet</text>

  <!-- Participants -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="65" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Learner Client</text>
    <line x1="65" y1="36" x2="65" y2="400" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="150" height="36" rx="6" fill="#1e293b" stroke="#818cf8"/>
    <text x="75" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">WebSocket Gateway</text>
    <line x1="75" y1="36" x2="75" y2="400" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#ef4444"/>
    <text x="70" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Redis 7 Pub/Sub</text>
    <line x1="70" y1="36" x2="70" y2="400" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(730, 80)">
    <rect x="0" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="65" y="23" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Mentor Client</text>
    <line x1="65" y1="36" x2="65" y2="400" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <!-- Step 1: Connect & TTL -->
  <line x1="145" y1="140" x2="365" y2="140" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="132" text-anchor="middle" fill="#cbd5e1" font-size="11">1. Connect WebSocket /ws/{user_id}</text>

  <line x1="365" y1="165" x2="590" y2="165" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="477" y="157" text-anchor="middle" fill="#cbd5e1" font-size="11">2. SET presence (TTL: 60s)</text>

  <!-- Step 2: Publish Join -->
  <line x1="590" y1="195" x2="795" y2="195" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="692" y="187" text-anchor="middle" fill="#cbd5e1" font-size="11">3. Broadcast "USER_JOINED"</text>

  <!-- Jitsi Connection Box -->
  <rect x="145" y="225" width="650" height="40" rx="8" fill="#1e1e38" stroke="#6366f1"/>
  <text x="470" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Both Clients Mount Jitsi Meet IFrame with Authoritative Room Link (meeting_link)</text>

  <!-- Live Sync Loop -->
  <line x1="145" y1="295" x2="365" y2="295" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="287" text-anchor="middle" fill="#cbd5e1" font-size="11">4. Add Note / Topic / Action Item</text>

  <line x1="365" y1="320" x2="590" y2="320" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="477" y="312" text-anchor="middle" fill="#cbd5e1" font-size="11">5. PUBLISH session event</text>

  <line x1="590" y1="345" x2="795" y2="345" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="692" y="337" text-anchor="middle" fill="#cbd5e1" font-size="11">6. Real-time Workspace Update</text>

  <rect x="100" y="420" width="750" height="44" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="475" y="447" text-anchor="middle" fill="#94a3b8" font-size="11">Zero Central Bottleneck: Multiple backend workers synchronize across Redis Pub/Sub channels seamlessly</text>
</svg>
