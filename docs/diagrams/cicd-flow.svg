<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Automated CI/CD &amp; Deployment Pipeline</text>
  <text x="475" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">GitHub Actions Workflow: Service Container Testing, Multi-Stage Builds, Security Audits, and GCP Cloud Run</text>

  <!-- Trigger -->
  <rect x="50" y="85" width="200" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="150" y="112" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700">Git Push / PR</text>
  <text x="150" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">main, ft/production</text>

  <!-- CI Container -->
  <rect x="300" y="85" width="600" height="280" rx="12" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="320" y="110" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">GITHUB ACTIONS CI PIPELINE (.github/workflows/ci-cd.yml)</text>

  <g transform="translate(320, 125)">
    <!-- Job 1 -->
    <rect x="0" y="0" width="260" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="700">Job 1: Backend Validation</text>
    <text x="15" y="44" fill="#cbd5e1" font-size="10">• Python 3.12 Setup &amp; Pip Cache</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="10">• Live Postgres 16 &amp; Redis 7 Services</text>
    <text x="15" y="80" fill="#10b981" font-size="10">• Alembic Upgrade &amp; Pytest Run</text>

    <!-- Job 2 -->
    <rect x="290" y="0" width="260" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="305" y="24" fill="#38bdf8" font-size="11" font-weight="700">Job 2: Frontend Validation</text>
    <text x="305" y="44" fill="#cbd5e1" font-size="10">• Node.js 20 Setup &amp; NPM Cache</text>
    <text x="305" y="62" fill="#cbd5e1" font-size="10">• Clean Dependency Install (npm ci)</text>
    <text x="305" y="80" fill="#10b981" font-size="10">• Vite Production Bundle Build</text>

    <!-- Job 3 -->
    <rect x="0" y="115" width="260" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="139" fill="#f59e0b" font-size="11" font-weight="700">Job 3: Security &amp; Leaks</text>
    <text x="15" y="159" fill="#cbd5e1" font-size="10">• Secret &amp; Private Key Regex Scans</text>
    <text x="15" y="177" fill="#cbd5e1" font-size="10">• Dependency Vulnerability Audits</text>
    <text x="15" y="195" fill="#10b981" font-size="10">• Zero Hardcoded Secrets Enforced</text>

    <!-- Job 4 -->
    <rect x="290" y="115" width="260" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="305" y="139" fill="#a855f7" font-size="11" font-weight="700">Job 4: Multi-Stage Docker Builds</text>
    <text x="305" y="159" fill="#cbd5e1" font-size="10">• Build Backend Container (Non-root)</text>
    <text x="305" y="177" fill="#cbd5e1" font-size="10">• Build Frontend Static Nginx SPA</text>
    <text x="305" y="195" fill="#10b981" font-size="10">• GitHub Actions Build Cache (gha)</text>
  </g>

  <line x1="250" y1="115" x2="300" y2="115" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CD Deployment Section -->
  <rect x="50" y="390" width="850" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="415" fill="#34d399" font-size="12" font-weight="700">CONTINUOUS DEPLOYMENT (GCP CLOUD RUN)</text>
  <text x="70" y="440" fill="#cbd5e1" font-size="11">1. Push Docker images to Artifact Registry • 2. Execute Cloud Run DB Migration Job • 3. Deploy Cloud Run Services</text>
  <text x="70" y="460" fill="#94a3b8" font-size="10">Automated smoke verification: GET /health and GET /healthz</text>

  <line x1="600" y1="365" x2="600" y2="390" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
</svg>
