<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Learning Journey &amp; Capability Progression</text>
  <text x="475" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Decoupled Learner Roadmap Progression vs Mentor Capability Verification</text>

  <!-- Flow Steps -->
  <g transform="translate(60, 90)">
    <!-- 1. Goal Selection -->
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">1. Select Goal</text>
    <text x="90" y="48" text-anchor="middle" fill="#cbd5e1" font-size="10">Target Skill (e.g. Docker)</text>

    <!-- 2. Journey Generation -->
    <rect x="220" y="0" width="180" height="70" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="310" y="28" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">2. Generate Journey</text>
    <text x="310" y="48" text-anchor="middle" fill="#cbd5e1" font-size="10">Milestone Roadmap</text>

    <!-- 3. Mentor Matching & Booking -->
    <rect x="440" y="0" width="180" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="530" y="28" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">3. Match &amp; Book</text>
    <text x="530" y="48" text-anchor="middle" fill="#cbd5e1" font-size="10">Verified Mentor (1 Coin)</text>

    <!-- 4. Session & Intelligence -->
    <rect x="660" y="0" width="180" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="750" y="28" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">4. Live Session &amp; AI</text>
    <text x="750" y="48" text-anchor="middle" fill="#cbd5e1" font-size="10">Collaborative Capture</text>
  </g>

  <!-- Connectors top row -->
  <line x1="240" y1="125" x2="280" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="125" x2="500" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="125" x2="720" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 5: Advance Roadmap -->
  <g transform="translate(440, 210)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">5. Advance Milestone &amp; Heatmap</text>
    <text x="200" y="52" text-anchor="middle" fill="#cbd5e1" font-size="11">Progress percentage increases • Learning activity logged</text>
    <text x="200" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Note: Mentor's own learning roadmap remains untampered</text>
  </g>

  <line x1="810" y1="160" x2="810" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Capability Fork Decision -->
  <g transform="translate(160, 340)">
    <rect x="0" y="0" width="360" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="30" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">Desire to Teach This Skill to Peers?</text>
    <text x="180" y="52" text-anchor="middle" fill="#cbd5e1" font-size="11">Candidate initiates Skill Verification Assessment</text>
    <text x="180" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">AI / Rubric-Assessed Test + Evidence Evaluation</text>
  </g>

  <line x1="440" y1="250" x2="340" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Capability Grant -->
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="340" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">Capability Promoted: VERIFIED</text>
    <text x="170" y="52" text-anchor="middle" fill="#cbd5e1" font-size="11">User is now discoverable as a Verified Mentor</text>
    <text x="170" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">Unlocks Availability Slot Management &amp; Coin Rewards</text>
  </g>

  <line x1="520" y1="385" x2="560" y2="385" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="60" y="470" width="830" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="475" y="496" text-anchor="middle" fill="#c7d2fe" font-size="11">Core Architectural Principle: The same account seamlessly shifts between Mentor (in Verified skills) and Learner (in In-Progress skills)</text>
</svg>
