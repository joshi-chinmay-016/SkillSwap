<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">SkillSwap Arena — Database Entity Relationship Diagram</text>
  <text x="550" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Authoritative PostgreSQL Schema (SQLAlchemy Models &amp; Alembic Migrations)</text>

  <!-- Center Hub: USERS -->
  <g transform="translate(420, 90)">
    <rect x="0" y="0" width="260" height="200" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#4f46e5"/>
    <text x="130" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">USERS</text>
    
    <text x="15" y="52" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b" font-weight="700">PK</tspan> id : Integer</text>
    <text x="15" y="70" fill="#cbd5e1" font-size="11"><tspan fill="#38bdf8" font-weight="700">UK</tspan> email : String(255)</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="11">password_hash : String(255)</text>
    <text x="15" y="106" fill="#cbd5e1" font-size="11">name : String(255)</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="11">role : String(20) [USER | ADMIN]</text>
    <text x="15" y="142" fill="#cbd5e1" font-size="11">is_active : Boolean (default=True)</text>
    <text x="15" y="160" fill="#cbd5e1" font-size="11">oauth_provider : String(50)</text>
    <text x="15" y="178" fill="#cbd5e1" font-size="11">created_at, updated_at : DateTime</text>
  </g>

  <!-- Left Column: PROFILES, WALLETS, TRANSACTIONS -->
  <g transform="translate(60, 90)">
    <!-- PROFILES -->
    <rect x="0" y="0" width="280" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PROFILES (1:1 with USERS)</text>
    <text x="15" y="46" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK,UK</tspan> user_id</text>
    <text x="15" y="64" fill="#cbd5e1" font-size="11">bio : Text | avatar_url : Text</text>
    <text x="15" y="82" fill="#cbd5e1" font-size="11">department : String | year : Integer</text>
    <text x="15" y="100" fill="#cbd5e1" font-size="11">credibility_score : Float (default=5.0)</text>
    <text x="15" y="118" fill="#cbd5e1" font-size="11">total_sessions_conducted : Integer</text>
    <text x="15" y="136" fill="#cbd5e1" font-size="11">created_at : DateTime</text>

    <!-- WALLETS -->
    <rect x="0" y="170" width="280" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="170" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="189" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">WALLETS (1:1 with USERS)</text>
    <text x="15" y="216" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK,UK</tspan> user_id</text>
    <text x="15" y="234" fill="#cbd5e1" font-size="11">balance : Integer (default=5 coins)</text>
    <text x="15" y="252" fill="#cbd5e1" font-size="11">updated_at : DateTime</text>

    <!-- WALLET_TRANSACTIONS -->
    <rect x="0" y="300" width="280" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="300" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="319" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">WALLET_TRANSACTIONS (1:N)</text>
    <text x="15" y="346" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK</tspan> user_id</text>
    <text x="15" y="364" fill="#cbd5e1" font-size="11">amount : Integer (+/-)</text>
    <text x="15" y="382" fill="#cbd5e1" font-size="11">type : WELCOME_BONUS | REWARD | ...</text>
    <text x="15" y="400" fill="#cbd5e1" font-size="11">reason : String(255)</text>
    <text x="15" y="418" fill="#cbd5e1" font-size="11"><tspan fill="#38bdf8">UK</tspan> reference_id : String(100)</text>
    <text x="15" y="436" fill="#cbd5e1" font-size="11">created_at : DateTime</text>
  </g>

  <!-- Right Column: SKILLS, USER_SKILLS, ASSESSMENTS -->
  <g transform="translate(760, 90)">
    <!-- SKILLS -->
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SKILLS</text>
    <text x="15" y="46" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#38bdf8">UK</tspan> name : String(100)</text>
    <text x="15" y="64" fill="#cbd5e1" font-size="11">category : String(100) NOT NULL</text>
    <text x="15" y="82" fill="#cbd5e1" font-size="11">description : Text</text>
    <text x="15" y="100" fill="#cbd5e1" font-size="11">created_at : DateTime</text>

    <!-- USER_SKILLS -->
    <rect x="0" y="140" width="280" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="140" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="159" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">USER_SKILLS (Capabilities)</text>
    <text x="15" y="186" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK</tspan> user_id, skill_id</text>
    <text x="15" y="204" fill="#cbd5e1" font-size="11">type : TEACH | LEARN</text>
    <text x="15" y="222" fill="#cbd5e1" font-size="11">verification_status : CLAIMED | VERIFIED | ...</text>
    <text x="15" y="240" fill="#cbd5e1" font-size="11">score : Float (assessment grade %)</text>
    <text x="15" y="258" fill="#cbd5e1" font-size="11">claimed_at : DateTime</text>
    <text x="15" y="276" fill="#cbd5e1" font-size="11">verified_at : DateTime</text>
    <text x="15" y="294" fill="#cbd5e1" font-size="11"><tspan fill="#38bdf8">UK</tspan> (user_id, skill_id, type)</text>

    <!-- LEARNING_JOURNEYS -->
    <rect x="0" y="330" width="280" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="330" width="280" height="28" rx="10" fill="#334155"/>
    <text x="140" y="349" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LEARNING_JOURNEYS</text>
    <text x="15" y="376" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK</tspan> user_id, skill_id</text>
    <text x="15" y="394" fill="#cbd5e1" font-size="11">status : active | completed | paused</text>
    <text x="15" y="412" fill="#cbd5e1" font-size="11">progress_percentage : Integer</text>
    <text x="15" y="430" fill="#cbd5e1" font-size="11">created_at, updated_at : DateTime</text>
  </g>

  <!-- Middle-Bottom: SESSIONS, FEEDBACKS, INTELLIGENCE, AUDIT -->
  <g transform="translate(60, 480)">
    <!-- SESSIONS -->
    <rect x="0" y="0" width="310" height="200" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="30" rx="10" fill="#059669"/>
    <text x="155" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SESSIONS</text>
    <text x="15" y="48" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK</tspan> mentor_id, learner_id, skill_id</text>
    <text x="15" y="66" fill="#cbd5e1" font-size="11">status : scheduled | in_progress | completed | cancelled</text>
    <text x="15" y="84" fill="#cbd5e1" font-size="11">scheduled_at : DateTime | duration_minutes : Int</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="11">meeting_link : String(500) (Authoritative Jitsi)</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="11">actual_start_at, actual_end_at : DateTime</text>
    <text x="15" y="138" fill="#cbd5e1" font-size="11">cancellation_reason : Text</text>
    <text x="15" y="156" fill="#cbd5e1" font-size="11">created_at, updated_at : DateTime</text>
    <text x="15" y="176" fill="#10b981" font-size="10" font-weight="600">Relationships: 1:N Notes, 1:1 Intelligence, 1:N Feedback</text>

    <!-- SESSION_INTELLIGENCE -->
    <rect x="340" y="0" width="310" height="200" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="340" y="0" width="310" height="30" rx="10" fill="#7c3aed"/>
    <text x="495" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SESSION_INTELLIGENCES (Grounded AI)</text>
    <text x="355" y="48" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK,UK</tspan> session_id</text>
    <text x="355" y="66" fill="#cbd5e1" font-size="11">summary : Text (Factual synthesis)</text>
    <text x="355" y="84" fill="#cbd5e1" font-size="11">skills_addressed : JSON</text>
    <text x="355" y="102" fill="#cbd5e1" font-size="11">key_takeaways : JSON</text>
    <text x="355" y="120" fill="#cbd5e1" font-size="11">guidance_notes : JSON</text>
    <text x="355" y="138" fill="#cbd5e1" font-size="11">recommended_actions : JSON</text>
    <text x="355" y="156" fill="#cbd5e1" font-size="11">generated_at : DateTime</text>
    <text x="355" y="176" fill="#a855f7" font-size="10" font-weight="600">Input: Notes, Questions, Struggles, Topics, ActionItems</text>

    <!-- ADMIN_AUDIT_LOGS & REPORTS -->
    <rect x="680" y="0" width="300" height="200" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="680" y="0" width="300" height="30" rx="10" fill="#b91c1c"/>
    <text x="830" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ADMIN_AUDIT_LOGS &amp; REPORTS</text>
    <text x="695" y="48" fill="#cbd5e1" font-size="11"><tspan fill="#f59e0b">PK</tspan> id | <tspan fill="#818cf8">FK</tspan> admin_user_id</text>
    <text x="695" y="66" fill="#cbd5e1" font-size="11">action : String(50) (e.g. SUSPEND_USER)</text>
    <text x="695" y="84" fill="#cbd5e1" font-size="11">target_type : String(50) | target_id : String(100)</text>
    <text x="695" y="102" fill="#cbd5e1" font-size="11">reason : Text (Mandatory Operator Justification)</text>
    <text x="695" y="120" fill="#cbd5e1" font-size="11">ip_address : String(50)</text>
    <text x="695" y="138" fill="#cbd5e1" font-size="11">metadata_payload : JSON</text>
    <text x="695" y="156" fill="#cbd5e1" font-size="11">created_at : DateTime (Append-Only)</text>
    <text x="695" y="176" fill="#ef4444" font-size="10" font-weight="600">Reports: Reporter, Reported, Status, Resolution</text>
  </g>

  <!-- Connectors -->
  <line x1="420" y1="160" x2="340" y2="160" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="680" y1="160" x2="760" y2="160" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="550" y1="290" x2="200" y2="480" stroke="#10b981" stroke-width="1.5"/>
  <line x1="550" y1="290" x2="830" y2="480" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="370" y1="580" x2="400" y2="580" stroke="#a855f7" stroke-width="1.5"/>
</svg>
