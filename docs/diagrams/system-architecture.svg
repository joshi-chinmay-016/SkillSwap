<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">SkillSwap Arena — System Architecture</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Decoupled presentation, domain orchestration, vector search, and distributed real-time state</text>

  <!-- Client Tier Container -->
  <rect x="40" y="90" width="920" height="90" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
  <text x="60" y="115" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CLIENT TIER (REACT 18 SPA)</text>
  
  <rect x="70" y="128" width="260" height="38" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Student Portal (Peer Learner / Mentor)</text>

  <rect x="370" y="128" width="260" height="38" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="500" y="152" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Admin Platform Console (/admin/*)</text>

  <rect x="670" y="128" width="260" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="800" y="152" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Real-time Presence &amp; Video Workspace</text>

  <!-- Edge Proxy -->
  <rect x="360" y="215" width="280" height="42" rx="10" fill="#1e1e38" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="241" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Nginx Reverse Proxy &amp; WSS Gateway</text>

  <line x1="200" y1="166" x2="420" y2="215" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="166" x2="500" y2="215" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="166" x2="580" y2="215" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowSky)"/>

  <!-- Backend Core Container -->
  <rect x="40" y="290" width="920" height="190" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5" filter="url(#glow)"/>
  <text x="60" y="315" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">FASTAPI APPLICATION TIER (ROUTER → SERVICE → REPOSITORY)</text>

  <!-- Backend Modules Grid -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="25" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Auth &amp; OAuth Router</text>

    <rect x="180" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="25" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Profiles &amp; Capabilities</text>

    <rect x="360" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="25" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Skill Tests &amp; Verifications</text>

    <rect x="540" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="620" y="25" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Peer Sessions &amp; Booking</text>

    <rect x="720" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="800" y="25" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Learning Journeys</text>

    <rect x="0" y="55" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">AI Session Intelligence</text>

    <rect x="180" y="55" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">AI Mentor (3072d RAG)</text>

    <rect x="360" y="55" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Coin Wallet &amp; Economy</text>

    <rect x="540" y="55" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="620" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Admin Operations</text>

    <rect x="720" y="55" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="800" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Metrics &amp; Tracing</text>

    <rect x="0" y="108" width="880" height="28" rx="6" fill="#1e1e38" stroke="#6366f1" stroke-dasharray="3 3"/>
    <text x="440" y="126" text-anchor="middle" fill="#c7d2fe" font-size="11">Cross-Cutting Guards: Active Account Check, RBAC (require_admin), X-Request-ID Correlation, Rate Limiting</text>
  </g>

  <line x1="500" y1="257" x2="500" y2="290" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

  <!-- Storage & Coordination Container -->
  <rect x="40" y="510" width="920" height="115" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
  <text x="60" y="533" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1">PERSISTENCE, CACHING &amp; EXTERNAL INFRASTRUCTURE</text>

  <rect x="60" y="546" width="200" height="64" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="160" y="572" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">PostgreSQL 16</text>
  <text x="160" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">37 Relational Tables</text>

  <rect x="290" y="546" width="200" height="64" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="390" y="572" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Redis 7.0+</text>
  <text x="390" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">Pub/Sub &amp; Presence TTL</text>

  <rect x="520" y="546" width="200" height="64" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="620" y="572" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">FAISS / Vector Store</text>
  <text x="620" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">3072d Document Halos</text>

  <rect x="750" y="546" width="190" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="845" y="572" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">External Integrations</text>
  <text x="845" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">Jitsi, Gemini &amp; Prometheus</text>

  <line x1="200" y1="480" x2="160" y2="546" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="440" y1="480" x2="390" y2="546" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="480" x2="620" y2="546" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="480" x2="845" y2="546" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowSky)"/>
</svg>
