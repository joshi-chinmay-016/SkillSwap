<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Peer Learning Session State Machine</text>
  <text x="475" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Lifecycle Transitions, Coin Escrow Integrity, and Administrative Cancellation Guardrails</text>

  <!-- States -->
  <!-- 1. Scheduled -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">1. SCHEDULED</text>
    <text x="110" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Deducts 1 Coin from Learner</text>
    <text x="110" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Idempotency-Key Enforced</text>
  </g>

  <!-- 2. In Progress -->
  <g transform="translate(365, 140)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">2. IN_PROGRESS</text>
    <text x="110" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Participant Presence Active</text>
    <text x="110" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Live Jitsi Room &amp; Notes Sync</text>
  </g>

  <!-- 3. Completed -->
  <g transform="translate(650, 140)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">3. COMPLETED</text>
    <text x="110" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Transfers 1 Coin to Mentor</text>
    <text x="110" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Triggers AI Synthesis &amp; Reviews</text>
  </g>

  <!-- 4. Cancelled -->
  <g transform="translate(365, 330)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">CANCELLED</text>
    <text x="110" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Refunds 1 Coin to Learner</text>
    <text x="110" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Audit Log Recorded if Admin</text>
  </g>

  <!-- Transitions -->
  <!-- Scheduled -> InProgress -->
  <line x1="300" y1="185" x2="365" y2="185" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="175" text-anchor="middle" fill="#cbd5e1" font-size="10">Start</text>

  <!-- InProgress -> Completed -->
  <line x1="585" y1="185" x2="650" y2="185" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="617" y="175" text-anchor="middle" fill="#cbd5e1" font-size="10">Finish</text>

  <!-- Scheduled -> Cancelled -->
  <line x1="190" y1="230" x2="365" y2="345" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="240" y="295" fill="#f87171" font-size="10">User / Admin Cancel</text>

  <!-- InProgress -> Cancelled -->
  <line x1="475" y1="230" x2="475" y2="330" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="490" y="285" fill="#f87171" font-size="10">Emergency Abort</text>
</svg>
