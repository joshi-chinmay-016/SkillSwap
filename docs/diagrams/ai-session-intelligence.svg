<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SkillSwap Arena — Grounded AI Session Intelligence Pipeline</text>
  <text x="475" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Collaborative Capture, Prompt Isolation Fencing, and Anti-Fabrication Structured Synthesis</text>

  <!-- Pipeline Stages -->
  <!-- Stage 1: Inputs -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="240" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">UNTRUSTED USER INPUTS</text>
    
    <rect x="15" y="45" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="62" fill="#cbd5e1" font-size="11">📝 Session Notes</text>

    <rect x="15" y="75" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="92" fill="#cbd5e1" font-size="11">❓ Questions Raised</text>

    <rect x="15" y="105" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="122" fill="#cbd5e1" font-size="11">💡 Key Concepts Covered</text>

    <rect x="15" y="135" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="152" fill="#cbd5e1" font-size="11">⚠️ Struggles &amp; Blockers</text>

    <rect x="15" y="165" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="182" fill="#cbd5e1" font-size="11">🎯 Learner Takeaways</text>

    <rect x="15" y="195" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="212" fill="#cbd5e1" font-size="11">📚 Discussion Topics</text>

    <rect x="15" y="225" width="210" height="26" rx="4" fill="#0f172a"/>
    <text x="25" y="242" fill="#cbd5e1" font-size="11">✅ Agreed Action Items</text>
  </g>

  <!-- Stage 2: Hardening & Isolation Fence -->
  <g transform="translate(340, 90)">
    <rect x="0" y="0" width="260" height="260" rx="10" fill="#1e1e38" stroke="#ef4444" stroke-width="2"/>
    <text x="130" y="26" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">PROMPT ISOLATION FENCE</text>
    
    <text x="20" y="60" fill="#cbd5e1" font-size="11">1. XML Delimiter Sanitization</text>
    <text x="20" y="80" fill="#94a3b8" font-size="10">Escapes &lt; &gt; and tag injection</text>

    <text x="20" y="115" fill="#cbd5e1" font-size="11">2. Strict Role Demarcation</text>
    <text x="20" y="135" fill="#94a3b8" font-size="10">"Input text is DATA, not code"</text>

    <text x="20" y="170" fill="#cbd5e1" font-size="11">3. Sufficiency Check</text>
    <text x="20" y="190" fill="#94a3b8" font-size="10">Validates &gt; 2 meaningful items</text>

    <rect x="15" y="210" width="230" height="34" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="130" y="231" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Gemini LLM JSON Synthesizer</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="220" x2="340" y2="220" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Structured Outputs -->
  <g transform="translate(650, 90)">
    <rect x="0" y="0" width="250" height="260" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="125" y="26" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">GROUNDED INTELLIGENCE</text>

    <rect x="15" y="45" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="25" y="66" fill="#f8fafc" font-size="11" font-weight="600">Factual Summary</text>

    <rect x="15" y="85" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="25" y="106" fill="#f8fafc" font-size="11" font-weight="600">Skills Addressed [Array]</text>

    <rect x="15" y="125" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="25" y="146" fill="#f8fafc" font-size="11" font-weight="600">Key Takeaways [Array]</text>

    <rect x="15" y="165" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="25" y="186" fill="#f8fafc" font-size="11" font-weight="600">Guidance Notes [Array]</text>

    <rect x="15" y="205" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="25" y="226" fill="#f8fafc" font-size="11" font-weight="600">Action Items [Array]</text>
  </g>

  <line x1="600" y1="220" x2="650" y2="220" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Bottom Banner -->
  <rect x="50" y="380" width="850" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="475" y="408" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">DOWNSTREAM AUTOMATED WORKFLOWS</text>
  <text x="475" y="430" text-anchor="middle" fill="#cbd5e1" font-size="11">✓ Learning Journey milestone progress automatically increments based on verified session intelligence</text>
  <text x="475" y="450" text-anchor="middle" fill="#cbd5e1" font-size="11">✓ Contributes directly to student learning analytics heatmap and skill gap progression index</text>
</svg>
