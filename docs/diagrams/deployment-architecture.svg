<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">SkillSwap Arena — GCP Cloud Run Deployment Architecture</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Serverless container execution, private VPC connectivity, and managed state storage</text>

  <!-- Internet Ingress -->
  <rect x="360" y="85" width="280" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="113" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">HTTPS Ingress / Cloud DNS &amp; SSL</text>

  <!-- GCP Boundary Box -->
  <rect x="40" y="155" width="920" height="430" rx="16" fill="#0f172a" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow)"/>
  <text x="65" y="182" fill="#60a5fa" font-size="13" font-weight="700" letter-spacing="1">GOOGLE CLOUD PLATFORM (REGION: us-central1)</text>

  <!-- Cloud Run Compute Row -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="410" height="100" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="20" y="28" fill="#93c5fd" font-size="13" font-weight="700">Frontend Cloud Run Service</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="11">Image: us-central1-docker.pkg.dev/.../skillswap-frontend</text>
    <text x="20" y="70" fill="#94a3b8" font-size="11">Specs: 0.5 vCPU | 256Mi | Port 80 (Nginx SPA) | Scale: 1-5</text>
    <text x="20" y="88" fill="#10b981" font-size="10" font-weight="600">● Startup &amp; Liveness Probes: /healthz</text>

    <rect x="470" y="0" width="410" height="100" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="490" y="28" fill="#a5b4fc" font-size="13" font-weight="700">Backend Cloud Run Service</text>
    <text x="490" y="50" fill="#cbd5e1" font-size="11">Image: us-central1-docker.pkg.dev/.../skillswap-backend</text>
    <text x="490" y="70" fill="#94a3b8" font-size="11">Specs: 1 vCPU | 1Gi | Port 8000 (FastAPI Uvicorn) | Scale: 1-10</text>
    <text x="490" y="88" fill="#10b981" font-size="10" font-weight="600">● Startup &amp; Liveness Probes: /health</text>
  </g>

  <line x1="450" y1="131" x2="265" y2="200" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="550" y1="131" x2="735" y2="200" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- VPC Access Connector Box -->
  <rect x="250" y="325" width="500" height="42" rx="8" fill="#1e1e38" stroke="#a855f7" stroke-width="1.5"/>
  <text x="500" y="351" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">Serverless VPC Access Connector (10.8.0.0/28)</text>

  <line x1="735" y1="300" x2="600" y2="325" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Managed Storage Tier -->
  <g transform="translate(60, 395)">
    <!-- Cloud SQL -->
    <rect x="0" y="0" width="270" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="26" fill="#34d399" font-size="12" font-weight="700">Cloud SQL (PostgreSQL 16)</text>
    <text x="20" y="48" fill="#cbd5e1" font-size="11">Instance: skillswap-postgres</text>
    <text x="20" y="68" fill="#94a3b8" font-size="10">Tier: db-f1-micro / db-custom</text>
    <text x="20" y="86" fill="#94a3b8" font-size="10">Private IP Peering Only</text>
    <text x="20" y="104" fill="#94a3b8" font-size="10">Automated Daily Backups</text>
    <text x="20" y="122" fill="#10b981" font-size="10" font-weight="600">Alembic Managed (m10a1)</text>

    <!-- Memorystore Redis -->
    <rect x="305" y="0" width="270" height="140" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="325" y="26" fill="#f87171" font-size="12" font-weight="700">Memorystore (Redis 7.0)</text>
    <text x="325" y="48" fill="#cbd5e1" font-size="11">Instance: skillswap-redis</text>
    <text x="325" y="68" fill="#94a3b8" font-size="10">Tier: Basic 1GB</text>
    <text x="325" y="86" fill="#94a3b8" font-size="10">Private VPC Service Access</text>
    <text x="325" y="104" fill="#94a3b8" font-size="10">Pub/Sub Multi-Worker Engine</text>
    <text x="325" y="122" fill="#10b981" font-size="10" font-weight="600">Presence TTL &amp; Rate Limits</text>

    <!-- Secret Manager & IAM -->
    <rect x="610" y="0" width="270" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="630" y="26" fill="#fbbf24" font-size="12" font-weight="700">GCP Secret Manager &amp; IAM</text>
    <text x="630" y="48" fill="#cbd5e1" font-size="11">Secrets: DATABASE_URL, JWT</text>
    <text x="630" y="68" fill="#94a3b8" font-size="10">OAuth Client IDs &amp; Secrets</text>
    <text x="630" y="86" fill="#94a3b8" font-size="10">Gemini LLM API Credentials</text>
    <text x="630" y="104" fill="#94a3b8" font-size="10">Service Account Binding</text>
    <text x="630" y="122" fill="#10b981" font-size="10" font-weight="600">Zero Hardcoded Secrets</text>
  </g>

  <line x1="450" y1="367" x2="200" y2="395" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="367" x2="440" y2="395" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="735" y1="300" x2="745" y2="395" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
</svg>
